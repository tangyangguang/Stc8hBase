[env:STC8H8K64U]
platform = intel_mcs51
board = STC8H8K64U
board_upload.maximum_size = 46592
extra_scripts =
    pre:link_app_base.py
    post:../upload_stcgal.py
custom_stcgal_protocol = stc8g
custom_stcgal_baud = 38400
custom_stcgal_trim = 11059.2
build_flags =
    -I../../../core
    -I../../../hal
    -I../../../protocols
    -I../../../board/stc8h8k64u_lqfp48_base
    -DSTC8H_CONFIG_INCLUDE=\"board_config.h\"
    -DSTC8H_PINS_INCLUDE=\"board_pins.h\"

[env:STC8H8K64U_mark_valid_iap]
platform = intel_mcs51
board = STC8H8K64U
board_upload.maximum_size = 46592
extra_scripts =
    pre:link_app_base.py
    post:../upload_stcgal.py
custom_stcgal_protocol = stc8g
custom_stcgal_baud = 38400
custom_stcgal_trim = 11059.2
build_flags =
    --stack-auto
    -I../../../core
    -I../../../hal
    -I../../../protocols
    -I../../../board/stc8h8k64u_lqfp48_base
    -DSTC8H_CONFIG_INCLUDE=\"board_config.h\"
    -DSTC8H_PINS_INCLUDE=\"board_pins.h\"
    -DH8K64U_OTA_MIN_APP_ENABLE_MARK_VALID_IAP=1
    -DSTC8H_OTA_APP_LIMIT=0xB7FFu
    -DSTC8H_IAP_OTA_PARAMS_ENABLE=1

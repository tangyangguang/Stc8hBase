[platformio]
default_envs = ptx, prx

[env]
platform = intel_mcs51
board = STC8H1K08
extra_scripts = post:../upload_stcgal.py
custom_stcgal_protocol = stc8g
custom_stcgal_baud = 38400
custom_stcgal_trim = 11059.2
build_flags =
    -I../../..//core
    -I../../..//hal
    -I../../..//drivers
    -I../../..//board/stc8h1k08_tssop20_demo
    -DSTC8H_CONFIG_INCLUDE=\"board_config.h\"
    -DSTC8H_PINS_INCLUDE=\"board_pins.h\"
    -DSTC8H_UART_ENABLE_RX=0
    -DSTC8H_UART_ENABLE_WRITE_RAM=0

[env:ptx]
build_flags =
    ${env.build_flags}
    -DNRF24_PAIR_DIAG_PTX=1

[env:prx]
build_flags =
    ${env.build_flags}
    -DNRF24_PAIR_DIAG_PRX=1

[env:ptx_1m_no_ack]
build_flags =
    ${env.build_flags}
    -DNRF24_PAIR_DIAG_PTX=1
    -DNRF24_PAIR_ACK_PAYLOAD=0
    -DNRF24_PAIR_DYNAMIC_PAYLOAD=0
    -DNRF24_PAIR_RETRANSMIT_DELAY_CODE=1

[env:prx_1m_no_ack]
build_flags =
    ${env.build_flags}
    -DNRF24_PAIR_DIAG_PRX=1
    -DNRF24_PAIR_ACK_PAYLOAD=0
    -DNRF24_PAIR_DYNAMIC_PAYLOAD=0
    -DNRF24_PAIR_RETRANSMIT_DELAY_CODE=1

[env:ptx_250k_15ack]
build_flags =
    ${env.build_flags}
    -DNRF24_PAIR_DIAG_PTX=1
    -DNRF24_PAIR_DATA_RATE=NRF24_PAIR_RATE_250KBPS
    -DNRF24_PAIR_RETRANSMIT_DELAY_CODE=3

[env:prx_250k_15ack]
build_flags =
    ${env.build_flags}
    -DNRF24_PAIR_DIAG_PRX=1
    -DNRF24_PAIR_DATA_RATE=NRF24_PAIR_RATE_250KBPS
    -DNRF24_PAIR_RETRANSMIT_DELAY_CODE=3

[env:ptx_250k_32ack]
build_flags =
    ${env.build_flags}
    -DNRF24_PAIR_DIAG_PTX=1
    -DNRF24_PAIR_DATA_RATE=NRF24_PAIR_RATE_250KBPS
    -DNRF24_PAIR_PAYLOAD_SIZE=32
    -DNRF24_PAIR_RETRANSMIT_DELAY_CODE=5

[env:prx_250k_32ack]
build_flags =
    ${env.build_flags}
    -DNRF24_PAIR_DIAG_PRX=1
    -DNRF24_PAIR_DATA_RATE=NRF24_PAIR_RATE_250KBPS
    -DNRF24_PAIR_PAYLOAD_SIZE=32
    -DNRF24_PAIR_RETRANSMIT_DELAY_CODE=5

[env:ptx_250k_32ack_2ms]
build_flags =
    ${env.build_flags}
    -DNRF24_PAIR_DIAG_PTX=1
    -DNRF24_PAIR_DATA_RATE=NRF24_PAIR_RATE_250KBPS
    -DNRF24_PAIR_PAYLOAD_SIZE=32
    -DNRF24_PAIR_RETRANSMIT_DELAY_CODE=7

[env:prx_250k_32ack_2ms]
build_flags =
    ${env.build_flags}
    -DNRF24_PAIR_DIAG_PRX=1
    -DNRF24_PAIR_DATA_RATE=NRF24_PAIR_RATE_250KBPS
    -DNRF24_PAIR_PAYLOAD_SIZE=32
    -DNRF24_PAIR_RETRANSMIT_DELAY_CODE=7

[env:ptx_250k_32ack_2500us]
build_flags =
    ${env.build_flags}
    -DNRF24_PAIR_DIAG_PTX=1
    -DNRF24_PAIR_DATA_RATE=NRF24_PAIR_RATE_250KBPS
    -DNRF24_PAIR_PAYLOAD_SIZE=32
    -DNRF24_PAIR_RETRANSMIT_DELAY_CODE=9

[env:prx_250k_32ack_2500us]
build_flags =
    ${env.build_flags}
    -DNRF24_PAIR_DIAG_PRX=1
    -DNRF24_PAIR_DATA_RATE=NRF24_PAIR_RATE_250KBPS
    -DNRF24_PAIR_PAYLOAD_SIZE=32
    -DNRF24_PAIR_RETRANSMIT_DELAY_CODE=9

[env:ptx_2m_no_ack]
build_flags =
    ${env.build_flags}
    -DNRF24_PAIR_DIAG_PTX=1
    -DNRF24_PAIR_DATA_RATE=NRF24_PAIR_RATE_2MBPS
    -DNRF24_PAIR_ACK_PAYLOAD=0
    -DNRF24_PAIR_DYNAMIC_PAYLOAD=0
    -DNRF24_PAIR_RETRANSMIT_DELAY_CODE=1

[env:prx_2m_no_ack]
build_flags =
    ${env.build_flags}
    -DNRF24_PAIR_DIAG_PRX=1
    -DNRF24_PAIR_DATA_RATE=NRF24_PAIR_RATE_2MBPS
    -DNRF24_PAIR_ACK_PAYLOAD=0
    -DNRF24_PAIR_DYNAMIC_PAYLOAD=0
    -DNRF24_PAIR_RETRANSMIT_DELAY_CODE=1

[env:ptx_matrix_fast]
build_flags =
    ${env.build_flags}
    -DNRF24_PAIR_DIAG_PTX=1
    -DNRF24_PAIR_MATRIX_DIAG=1
    -DDRV_NRF24L01_ENABLE_CHECK_PRESENT=0
    -DDRV_NRF24L01_ENABLE_ARG_CHECK=0
    -DDRV_NRF24L01_ENABLE_RX_PACKET_API=0
    -DDRV_NRF24L01_ENABLE_ACK_PRELOAD_API=0
    -DDRV_NRF24L01_ENABLE_WRITE_ACK_PAYLOAD=0
    -DNRF24_PAIR_SEND_PERIOD_MS=5
    -DNRF24_PAIR_SUMMARY_INTERVAL=1000
    -DNRF24_PAIR_TX_WAIT_LIMIT=30000

[env:prx_matrix_fast]
build_flags =
    ${env.build_flags}
    -DNRF24_PAIR_DIAG_PRX=1
    -DNRF24_PAIR_MATRIX_DIAG=1
    -DDRV_NRF24L01_ENABLE_CHECK_PRESENT=0
    -DDRV_NRF24L01_ENABLE_ARG_CHECK=0
    -DDRV_NRF24L01_ENABLE_TX_RESULT_API=0
    -DDRV_NRF24L01_ENABLE_READ_OBSERVE_TX=0
    -DNRF24_PAIR_SEND_PERIOD_MS=5
    -DNRF24_PAIR_SUMMARY_INTERVAL=1000
    -DNRF24_PAIR_TX_WAIT_LIMIT=30000
